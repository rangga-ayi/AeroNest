<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="aeroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Disc for High Contrast on any browser theme -->
  <circle cx="50" cy="50" r="48" fill="#0f172a" />
  <!-- Outer Hexagon with Emerald-Cyan Gradient -->
  <path
    d="M50 14 L82 32 L82 68 L50 86 L18 68 L18 32 Z"
    stroke="url(#aeroGrad)"
    stroke-width="5"
    stroke-linejoin="round"
    fill="rgba(15, 23, 42, 0.85)"
  />
  <!-- Inner Dashed Telemetry Hexagon -->
  <path
    d="M34 40 L50 31 L66 40 L66 58 L50 67 L34 58 Z"
    stroke="#00f2fe"
    stroke-width="3"
    stroke-dasharray="4 2"
    fill="none"
  />
  <!-- Center Core Sensor Node -->
  <circle cx="50" cy="49" r="6" fill="#10b981" filter="url(#glow)" />
</svg>
