<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="ogBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#061826" />
    </linearGradient>
    <linearGradient id="ogAeroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>
    <filter id="ogGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Slate Background -->
  <rect width="1200" height="630" fill="url(#ogBgGrad)" />

  <!-- Subtle Ambient Glow Rings -->
  <circle cx="280" cy="315" r="220" fill="none" stroke="#10b981" stroke-width="1.5" opacity="0.15" />
  <circle cx="280" cy="315" r="320" fill="none" stroke="#00f2fe" stroke-width="1" opacity="0.1" stroke-dasharray="8 8" />

  <!-- Brand Hexagon Logo (Matching AeroNestLogo) -->
  <g transform="translate(180, 215) scale(2.0)">
    <!-- Outer Hexagon -->
    <path
      d="M50 8 L86 29 L86 71 L50 92 L14 71 L14 29 Z"
      stroke="url(#ogAeroGrad)"
      stroke-width="5"
      stroke-linejoin="round"
      fill="rgba(19, 27, 38, 0.85)"
    />
    <!-- Inner Dashed Hexagon -->
    <path
      d="M32 38 L50 28 L68 38 L68 58 L50 68 L32 58 Z"
      stroke="#00f2fe"
      stroke-width="3.5"
      stroke-dasharray="4 2"
      fill="none"
    />
    <!-- Core Sensor Node with Glow -->
    <circle cx="50" cy="48" r="6" fill="#10b981" filter="url(#ogGlow)" />
  </g>

  <!-- Brand Typography Header -->
  <text x="440" y="270" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="76" fill="#f8fafc" letter-spacing="-1.5">
    Aero<tspan fill="#00f2fe">Nest</tspan>
  </text>
  <text x="440" y="325" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="600" font-size="28" fill="#10b981" letter-spacing="1">
    IOT ENVIRONMENTAL MONITORING
  </text>
  <text x="440" y="375" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="400" font-size="22" fill="#94a3b8">
    Sistem pemantauan suhu, kelembapan, dan tekanan udara berbasis
  </text>
  <text x="440" y="410" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="400" font-size="22" fill="#94a3b8">
    ESP8266 Wemos D1 Mini dengan data cuaca dan visualisasi 3D.
  </text>

  <!-- Metric Badges Bottom Row -->
  <g transform="translate(440, 460)">
    <!-- Badge 1: Temperature -->
    <rect width="180" height="70" rx="14" fill="rgba(30, 41, 59, 0.7)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5" />
    <text x="20" y="30" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600" fill="#94a3b8">SUHU RUANG</text>
    <text x="20" y="55" font-family="'JetBrains Mono', monospace" font-size="22" font-weight="700" fill="#38bdf8">26.5°C</text>

    <!-- Badge 2: Humidity -->
    <rect x="200" width="180" height="70" rx="14" fill="rgba(30, 41, 59, 0.7)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5" />
    <text x="220" y="30" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600" fill="#94a3b8">KELEMBAPAN</text>
    <text x="220" y="55" font-family="'JetBrains Mono', monospace" font-size="22" font-weight="700" fill="#10b981">55.0%</text>

    <!-- Badge 3: Pressure -->
    <rect x="400" width="180" height="70" rx="14" fill="rgba(30, 41, 59, 0.7)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5" />
    <text x="420" y="30" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600" fill="#94a3b8">TEKANAN UDARA</text>
    <text x="420" y="55" font-family="'JetBrains Mono', monospace" font-size="22" font-weight="700" fill="#f59e0b">1012 hPa</text>
  </g>
</svg>
